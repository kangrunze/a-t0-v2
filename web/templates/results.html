{% extends "base.html" %}
{% block title %}回测结果{% endblock %}

{% block content %}
<div class="page-header">
    <h2>回测结果</h2>
    <div class="caption">逐股 HTML 可视化报告 · 与 CLI 产物一致</div>
</div>

<div class="row g-3 mb-3">
    <div class="col-auto">
        <select id="run-select" class="form-select" style="min-width:340px;">
            <option value="">— 选择回测运行 —</option>
            {% for r in runs %}
            <option value="{{ r.id }}">#{{ r.id }} — {{ r.name or '未命名' }} · {{ r.status }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="col-auto d-flex align-items-end">
        <span class="text-secondary" id="run-meta"></span>
    </div>
</div>

<div class="row g-3">
    <div class="col-lg-4">
        <div class="card h-100">
            <div class="card-body d-flex flex-column">
                <div class="card-title">个股报告</div>
                <div id="stock-list" class="list-group flex-grow-1" style="max-height:75vh;overflow:auto;">
                    <div class="text-secondary text-center py-4">请选择回测运行</div>
                </div>
            </div>
        </div>
    </div>
    <div class="col-lg-8">
        <div class="card h-100">
            <div class="card-body d-flex flex-column">
                <div class="card-title d-flex justify-content-between align-items-center">
                    <span>报告预览</span>
                    <a id="open-new" class="small text-secondary" href="#" target="_blank" style="display:none;">新窗口打开 ↗</a>
                </div>
                <div id="report-frame-wrap" class="flex-grow-1 mt-2">
                    <div id="report-placeholder" class="text-secondary text-center py-5">
                        从左侧选择一只股票查看 HTML 报告
                    </div>
                    <iframe id="report-frame"
                            style="width:100%;height:75vh;border:1px solid #e5e7eb;border-radius:8px;display:none;background:#fff;"></iframe>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function () {
    var runSelect = document.getElementById('run-select');
    var stockList = document.getElementById('stock-list');
    var frame = document.getElementById('report-frame');
    var placeholder = document.getElementById('report-placeholder');
    var openNew = document.getElementById('open-new');
    var runMeta = document.getElementById('run-meta');

    function hideFrame() {
        frame.style.display = 'none';
        frame.src = 'about:blank';
        placeholder.style.display = 'block';
        openNew.style.display = 'none';
    }

    function showReport(runId, code) {
        placeholder.style.display = 'none';
        frame.style.display = 'block';
        var url = '/results/api/' + runId + '/html/' + code;
        frame.src = url;
        openNew.href = url;
        openNew.style.display = 'inline';
    }

    runSelect.addEventListener('change', function () {
        var runId = this.value;
        hideFrame();
        runMeta.textContent = '';
        if (!runId) {
            stockList.innerHTML = '<div class="text-secondary text-center py-4">请选择回测运行</div>';
            return;
        }
        stockList.innerHTML = '<div class="text-secondary text-center py-4">加载中…</div>';
        fetch('/results/api/' + runId + '/stocks')
            .then(function (r) { return r.json(); })
            .then(function (data) {
                if (data.error) {
                    stockList.innerHTML = '<div class="text-danger p-2">' + data.error + '</div>';
                    return;
                }
                if (!data.stocks || data.stocks.length === 0) {
                    stockList.innerHTML = '<div class="text-secondary text-center py-4">该运行暂无个股数据</div>';
                    return;
                }
                // 统计有多少只股票有 HTML 报告
                var withHtml = data.stocks.filter(function (s) { return s.has_html; }).length;
                runMeta.textContent = '共 ' + data.stocks.length + ' 只 · 含报告 ' + withHtml + ' 只';

                var html = '';
                data.stocks.forEach(function (s) {
                    var pnlClass = s.net_pnl >= 0 ? 'text-up' : 'text-down';
                    var wr = (s.win_rate * 100).toFixed(1);
                    html += '<div class="list-group-item d-flex justify-content-between align-items-center" ' +
                        'style="cursor:' + (s.has_html ? 'pointer' : 'default') + ';">' +
                        '<div>' +
                        '<div class="num-mono"><strong>' + s.code + '</strong></div>' +
                        '<div class="small text-secondary">配对 ' + s.paired_trades + ' · 胜率 ' + wr + '% · ' +
                        '<span class="' + pnlClass + '">' + (s.net_pnl >= 0 ? '+' : '') + s.net_pnl.toFixed(0) + '</span></div>' +
                        '</div>' +
                        (s.has_html
                            ? '<button class="btn btn-outline-secondary btn-sm view-btn" data-code="' + s.code + '">' +
                              '<i class="bi bi-file-earmark-richtext"></i> 查看</button>'
                            : '<span class="badge bg-light text-secondary border">无报告</span>') +
                        '</div>';
                });
                stockList.innerHTML = html;

                stockList.querySelectorAll('.view-btn').forEach(function (btn) {
                    btn.addEventListener('click', function (e) {
                        e.stopPropagation();
                        showReport(runId, btn.getAttribute('data-code'));
                    });
                });
                // 整行点击也可触发（仅对有报告的）
                stockList.querySelectorAll('.list-group-item').forEach(function (item) {
                    var btn = item.querySelector('.view-btn');
                    if (btn) {
                        item.addEventListener('click', function () {
                            showReport(runId, btn.getAttribute('data-code'));
                        });
                    }
                });
            })
            .catch(function () {
                stockList.innerHTML = '<div class="text-danger p-2">加载失败</div>';
            });
    });
});
</script>
{% endblock %}
