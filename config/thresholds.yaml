# ═══════════════════════════════════════════════════════════════
# L5 T+0 日内做T — 阈值集中配置
# ═══════════════════════════════════════════════════════════════
# 方案 v0.2 第八节："所有阈值集中配置，禁止散落在各脚本里硬编码"
# 各模块 dataclass 默认值仍保留（作为 fallback），实盘入口优先从此文件加载。
# 所有阈值均为起始参考值，需回测校准后才能上生产（方案 v0.2 4.3 节）。

# ── 数据根目录（src/at0/paths.py 读取）──
# 数据已迁出代码仓库，统一存放于此目录。子目录结构与原 data/ 一致：
#   {root}/minute_local/  {root}/zz500_5min/  {root}/minute_bars/  ...
# 优先级：环境变量 AT0_DATA_DIR > 此处 data.root > <项目根>/data
data:
  root: D:\project\data

# ── 决策层信号参数（at0.strategy.SignalParams）──
signal:
  vwap_dev_atr_multiplier: 0.8      # VWAP 偏离度阈值 = ±0.8 × ATR_intraday（相对值）
  bb_period: 20                     # 布林带周期
  bb_std: 2.0                       # 布林带标准差倍数
  ema_period: 20                    # EMA 周期（位置基准补充）
  rsi_period: 14
  rsi_overbought: 70.0              # RSI 超买（辅助，方案 v0.2 起始值）
  rsi_oversold: 30.0                # RSI 超卖（辅助，方案 v0.2 起始值）
  kdj_n: 9
  kdj_m1: 3
  kdj_m2: 3
  kdj_overbought: 80.0              # KDJ K 超买（主触发）
  kdj_oversold: 20.0                # KDJ K 超卖（主触发）
  trend_filter_enabled: true        # 是否启用 MACD/DMI 趋势过滤
  adx_trend_threshold: 25.0         # ADX > 此值视为趋势盘
  vol_ratio_lookback: 5             # 量比当前窗口
  vol_ratio_baseline: 20            # 量比基准窗口
  shrink_threshold: 0.8             # 缩量阈值：当前5min量 < 过去20min均量 × 0.8
  mfi_overbought: 80.0              # MFI 超买（资金超买）
  mfi_oversold: 20.0                # MFI 超卖（资金超卖）
  active_sell_pressure: 0.55        # 主动卖占比 > 此值视为卖压
  active_buy_pressure: 0.55         # 主动买占比 > 此值视为买盘
  min_rules_to_trigger: 3           # 4 项中至少 3 项满足
  # ── 趋势跟随参数（2026-07-24 策略转向，当前主力逻辑）──
  # 数据诊断：5min VWAP偏离后65%概率延续，29%概率回归，转为顺趋势方向开仓
  tf_adx_threshold: 35.0            # ADX > 此值确认趋势存在（v5降频：30→35）
  tf_vol_ratio_min: 2.0             # 量比 > 此值确认量能放大（v5降频：1.5→2.0）
  tf_trend_reverse_adx: 28.0        # ADX<此值视为趋势减弱（平仓条件）
  tf_vwap_cross_threshold: 0.002    # |VWAP偏离| < 此值视为VWAP穿越（平仓条件，0.2%）
  tf_kdj_reverse_bars: 2            # KDJ连续N根反向确认（平仓条件，防单根噪声）
  # ── P2: Alpha 连续评分开关（主计划 S2.3）──
  # 2026-07-30：V3 Alpha 正式设为默认策略模式，不再使用 TF/MR
  # 100股×1年验证最优参数（sl2配置）：
  #   th=72, sl=0.002, tr=0.25 → 净盈亏+191K, 胜率73.5%, payoff1.42, 盈利79/100
  #   对比 TF baseline: 净盈亏+445K 但结构性依赖规则驱动
  #   对比 MR v17 ADX30: 净盈亏+369K 但成本占比29.4%
  # V3 Alpha 优势：七维度Engine评分过滤低质量信号，payoff1.42为所有策略最高
  use_continuous_alpha: true         # V3 Alpha 评分模式（七维度 Engine 评分替代布尔触发）
  alpha_weight_vwap: 1.0             # @deprecated 旧 5 维度权重（V3 改用 v3_alpha_weights）
  alpha_weight_rsi: 1.0
  alpha_weight_kdj: 1.0
  alpha_weight_adx: 1.0
  alpha_weight_volume: 1.0
  alpha_threshold_open: 72.0         # V3 开仓门槛（100股×1年验证最优：60→72，胜率+5pp）
  # V3 平仓门槛（2026-07-30 修复"买卖点过近"问题）
  # 旧实现：平仓=开仓=72，开仓后1-2根K线对向alpha易达72，导致5分钟内买卖，捕捉不到完整波段
  # 新实现：平仓85 >> 开仓72，只有极强反转才信号平仓，让趋势发展，trailing为主平仓机制
  v3_alpha_close_threshold: 85.0     # 平仓阈值（85 >> 开仓72，让趋势发展）

  # ── V3: 七维度 Alpha 评分权重（G1 阶段，用户方案 §十二）──
  # Trend 25% / Wave 20% / Support 15% / Momentum 15%
  # Liquidity 10% / ExpectedMove 10% / Risk 5%
  # G2-G7 各 Engine 实现后，对应维度子评分替换为 Engine 产出
  # ExpectedMove 和 Risk 在 G5/G6 实现前，权重实际转移给 Trend（占位返回中性 50）
  v3_alpha_weights:
    trend: 0.25
    wave: 0.20
    support: 0.15
    momentum: 0.15
    liquidity: 0.10
    expected_move: 0.10
    risk: 0.05

  # ── V4: L4 Expected Move 开仓闸门（Decision Engine，2026-07-30）──
  # 用户方案：Alpha 已够用，瓶颈在 Exit。L4 作为开仓闸门防"买晚"：
  #   alpha_score >= alpha_threshold_open 后，额外检查 Expected Move RR
  #   RR = |预期收益| / ATR（剩余空间 vs 当前波动），RR < 阈值拒绝开仓
  #   机制：Alpha=95 但剩余空间只有 0.4% 时放弃，自然拉远买卖点距离
  #
  # 100股×1年 RR 阈值扫描定标（2026-07-30）：
  #   RR≥1.5: 净盈亏-2.0%, Payoff1.41(持平), 交易-8%  → 太松，无增益
  #   RR≥2.0: 净盈亏-3.2%, Payoff1.56(+9.9%), 交易-20% → 最优平衡点★
  #   RR≥2.5: 净盈亏-21.5%, Payoff1.51, 交易-35%      → 太严，伤净盈亏
  # RR≥2.0 同时实现：Payoff最优/成本效率最优(23.10%)/每笔期望+21.1%/盈利股86(+8.9%)
  # dataclass默认False（安全兜底），yaml设为true启用
  expected_move_gate_enabled: true       # L4 闸门开关
  expected_move_rr_min: 2.0              # RR >= 2.0 才允许开仓（100股扫描最优）

  # ── V4: L6 HoldConfidence + L7 TrendFailure 退出引擎（Decision Engine，2026-07-30）──
  # 用户方案：瓶颈在 Exit。Trailing 切香肠（持15min vs 主趋势60min）。
  # L6/L7 替代 Trailing：锚定趋势状态退出，NOT 盈亏回撤。
  #   L6: 每根K线重打分（EMA斜率30%+ADX25%+价格EMA20关系20%+MACD15%+量能10%）
  #       信心 < hold_confidence_exit_threshold 退出
  #   L7: 趋势硬失败（EMA20破位+ADX<25+MACD反转+量能枯竭，2+信号退出）
  #
  # 100股×1年 A/B 验证结论（2026-07-30，5组对比）：
  #   baseline(全关):     净+134,119  Payoff2.29  每笔+148.86  avg_loss-120.72
  #   L4 only(最优):      净+132,118  Payoff2.55  每笔+175.46  avg_loss-117.65
  #   L4+L6(th70)/L7:     净+119,832  Payoff2.14  每笔+155.63  avg_loss-138.71
  #   L4+L6(th50)/L7:     净+119,655  Payoff2.13  每笔+155.60  avg_loss-139.85
  #   L4+L7 only(th=0):   净+122,013  Payoff2.19  每笔+159.29  avg_loss-135.74
  # 结论：L6/L7 在所有参数下都伤害性能。核心问题：L6/L7 趋势状态退出系统性增大
  #   avg_loss（-120→-136~-140），与 V3 Alpha "高频小赚"模式冲突。
  #   V3 Alpha 依赖 trailing 精确止盈保护，L6/L7 提前退出导致亏损放大。
  # 决定：禁用 L6/L7，保留 L4 only 作为新基线。改用 ATR 自适应 Trailing 改进退出。
  # dataclass默认False（安全兜底），yaml设为false（验证后禁用）
  hold_confidence_exit_enabled: false    # L6/L7 退出引擎开关（验证后禁用）
  hold_confidence_exit_threshold: 70.0   # 信心 < 70 退出（0-100，越低越宽松）

  # ── V4: 趋势自适应 Trailing（Decision Engine，2026-07-30）──
  # 用户方案：Trailing = ATR × TrendScore（强趋势50%，弱趋势20%）
  # 实现：根据 ADX 调整 trailing_ratio（保持比例模型 trailing_distance = max_favorable × ratio）
  #   强趋势(ADX≥35): trailing_ratio=0.50（宽，让趋势跑，vs baseline 0.25）
  #   中趋势(25≤ADX<35): trailing_ratio=0.35
  #   弱趋势(ADX<25): trailing_ratio=0.20（紧，锁利润，vs baseline 0.25）
  #
  # 100股×1年 A/B 验证结论（2026-07-30，3组对比）：
  #   L4 only baseline:    净+132,118  Payoff2.55  avg_win+300.27  ← 最优
  #   conservative(35/25/20): 净+109,867  Payoff2.23  avg_win+262.30  (-16.8%)
  #   balanced(40/30/15):    净+98,136   Payoff2.06  avg_win+242.28  (-25.7%)
  #   aggressive(50/35/20):  净+75,280   Payoff1.73  avg_win+203.28  (-43.0%)
  # 结论：趋势自适应只影响盈利腿的 avg_win（随ratio变宽单调下降），
  #   不影响胜率/交易笔数/avg_loss。V3 Alpha 的 trailing_ratio=0.25 已是最优。
  # 决定：禁用趋势自适应 Trailing，保持固定 trailing_ratio=0.25。
  # dataclass默认False（安全兜底），yaml设为false（验证后禁用）
  atr_adaptive_trailing_enabled: false     # 趋势自适应 Trailing 开关（验证后禁用）
  atr_trailing_strong: 0.50              # 强趋势 trailing_ratio（ADX≥35，让趋势跑）
  atr_trailing_medium: 0.35              # 中趋势 trailing_ratio（25≤ADX<35）
  atr_trailing_weak: 0.20               # 弱趋势 trailing_ratio（ADX<25，锁利润）

  # ── V4: L7 信号调整 Trailing（Trend-Adaptive Trailing via L7 Signals）──
  # 与 ATR 自适应的区别：用多因子 L7 信号（EMA20+ADX+MACD+量能）分级调整 trailing_ratio
  # 机制：趋势健康时宽 trailing 让趋势跑，趋势减弱/失败时紧 trailing 快速锁利润
  # 与 L6/L7 直接退出的区别：不直接退出（避免 avg_loss 增大），只调整 trailing 回撤幅度
  # 信号定义（0~4）：
  #   1. EMA20 破位: 价格穿越 EMA20 到不利侧
  #   2. ADX 衰减: ADX < 25
  #   3. MACD 反转: MACD hist 与持仓方向相反
  #   4. 量能枯竭: volume_ratio < 0.6
  # 分级：L7=0(健康)→宽 trailing / L7=1(减弱)→紧 / L7≥2(失败)→更紧
  #
  # 100股×1年 A/B 验证结论（2026-07-30，11组参数扫描）：
  #   L4 only baseline (fixed 0.25):   净+186,925  Payoff1.52  avg_win+93.39
  #   conservative (0.30/0.25/0.15):   净+205,171  Payoff1.60  avg_win+98.75  (+9.8%)
  #   aggressive  (0.40/0.25/0.10):    净+214,161  Payoff1.65  avg_win+101.39 (+14.6%)
  #   tight-all   (0.25/0.15/0.03):    净+251,097  Payoff1.82  avg_win+112.26 (+34.3%)
  #   w005f003    (0.25/0.05/0.03):    净+274,932  Payoff1.94  avg_win+119.26 (+47.1%) ← 最优
  #   unified     (0.25/0.03/0.03):    净+279,698  Payoff1.96  avg_win+120.67 (+49.6%)
  #
  # 关键发现（分解实验）：
  #   1. 收紧 failing(0.25→0.05) 是主要驱动（+19.6%），放宽 healthy(0.25→0.50) 单独无效(-0.2%)
  #   2. 收紧 weakening(0.25→0.05) 贡献最大（+12.8pp），failing(0.05→0.03) 边际递减(+2.0pp)
  #   3. 胜率/交易笔数/avg_loss 完全不变 → 纯退出改进，不干预开仓
  #   4. 机制：L7 信号是趋势减弱的可靠早期预警，一旦出现即紧 trailing 锁利润
  # 决定：启用 0.25/0.05/0.03（w=0.05 为边际递减拐点，3级结构更有原则性）
  trend_adaptive_trailing_enabled: true   # L7 信号调整 Trailing 开关（验证通过，启用）
  trend_trailing_healthy: 0.25          # L7=0 信号（趋势健康）：基线 trailing（放宽healthy单独无效，保持0.25）
  trend_trailing_weakening: 0.05        # L7=1 信号（趋势减弱）：紧 trailing，快速锁利润
  trend_trailing_failing: 0.03          # L7≥2 信号（趋势失败）：更紧 trailing，几乎立即锁利润

  # ── Stage K: 均值回归模式（与趋势跟随互斥，手动选择）──
  # K0闸门：振幅筛选36只×3年，|vwap_dev|≥3%时回归概率55-64%且期望值为正
  # 触发：z-score标准化 + 衰竭确认 + 量能约束
  # 止盈：基于开仓价的绝对价格收益率（2026-07-29 修复 VWAP 漂移问题）
  # 止损/持仓/仓位：在backtest段通过mr_*参数覆盖（比趋势跟随更紧）
  #
  # 2026-07-29 平仓逻辑重构（v4→v17，600995从-2450到+508）：
  #   旧实现用 vwap_dev 相对回归，VWAP 漂移导致买卖点价格和时间接近（净亏-2450）
  #   新实现5层修复：
  #     1) 绝对价格止盈替代VWAP回归（解决VWAP漂移）
  #     2) MR止盈优先于止损执行（解决止损抢跑致胜率0%）
  #     3) 收盘价止损替代盘中极值（解决5min盘中噪声扫损，v8关键修复-748）
  #     4) 止损延迟mr_min_holding_bars根K线（给价格回归时间）
  #     5) 止损0.1%:止盈0.8%盈亏比8:1（低胜率高盈亏比，v17扩大波动范围）
  #
  # v13→v17参数演进（用户要求扩大买卖点距离和持仓时间）：
  #   v13 tp=0.3% hold=3  净+267 止盈单笔20.84元 持仓15分钟
  #   v16 tp=0.5% hold=4  净+225 止盈单笔27.57元 持仓25分钟
  #   v17 tp=0.8% hold=6  净+508 止盈单笔42.61元 持仓42分钟 ← 最优，买卖点距离翻倍
  #
  # 10只随机股票×3年验证（2026-07-29，tag=mr_v17_validate10）：
  #   10/10全部盈利，净盈亏+32,530元，胜率18.4%，盈亏比6.96:1
  #   单笔均盈+107.71 单笔均亏-15.47 毛利润+47,733 成本15,203
  #   机制：MR信号在极值开仓，等待0.8%回归止盈（持仓42分钟），否则快速止损0.1%
  #         低胜率(18%)高盈亏比(7:1)→每笔期望+4.9元，买卖点距离充分
  strategy_mode: trend_following      # V3 Alpha模式（use_continuous_alpha=true时走七维度评分）
  mr_z_threshold: 1.0               # z-score触发阈值（v9验证：z=1.5更差，保持1.0）
  mr_lookback_bars: 12              # 回看窗口（计算价格极值、衰竭确认）
  mr_target_return: 0.008           # 绝对价格止盈阈值（0.8%，v17验证最优，v19移动止盈更差）
  mr_min_holding_bars: 6            # 开仓后最小持仓K线数（6根=30分钟，v17配合大止盈）
  mr_fatigue_rebound: 0.002         # 衰竭确认回升幅度（0.2%，v18验证0.1%对买入点无改善）
  mr_trailing_ratio: 0.0            # MR移动止盈回撤比例（0=固定止盈，v19验证移动止盈在5min更差）
  mr_vol_ratio_max: 1.5             # 量比上限：量比>此值视为趋势加速（不触发）
  mr_adx_max: 30.0                  # ADX上限：ADX>此值视为强趋势（不触发均值回归）
  # 2026-07-30 ADX过滤验证（100股×1年×4组A/B）：
  #   无过滤:  配对28084 净盈亏+380,191 成本/毛利36.0% 胜率21.9% 单笔13.5元
  #   ADX25:  配对19438 净盈亏+320,527 成本/毛利30.6% 胜率23.3% 单笔16.5元
  #   ADX30:  配对21036 净盈亏+368,956 成本/毛利29.4% 胜率23.0% 单笔17.5元 ← 最优
  #   ADX35:  配对22696 净盈亏+343,909 成本/毛利32.9% 胜率22.6% 单笔15.2元
  # 机制：ADX30-35区间为"强趋势持续区"（MR最易失败），ADX>35为"趋势 exhaustion区"（MR反而有效）
  # ADX30在净盈亏（-3%）和成本效率（-6.6pp）间取得最佳平衡，单笔收益提升30%
  # ── 废弃字段（被 mr_target_return 替代，保留兼容但不再使用）──
  mr_take_profit_reversion_ratio: 0.3  # @deprecated 旧相对回归比例，VWAP漂移导致净亏
  mr_min_reversion: 0.001           # @deprecated 旧最小回归幅度，0.1%远小于0.27%成本
  # ── J2: 回踩入场（买入侧分离模式，2026-07-29 验证通过正式启用）──
  # 设计：趋势确认（历史冲高）+ 入场价格确定（回踩到VWAP附近）分离
  # 验证依据（36股×3年×4组A/B，新VWAP基线 sl=0.002/tr=0.2）：
  #   baseline(关): 配对5375 净盈亏+623,767 CE均值2.26% CE中位1.91% payoff2.31
  #   J2(开):      配对10123 净盈亏+1,184,608(+90%) CE均值3.14%(+39%) CE中位2.06% payoff2.07
  #   win_rate 69.0%→69.1%（维持），成本毛利比 12.3%→9.3%（改善）
  #   机制：回踩到VWAP附近买入，买入点更贴近日内相对低点 → CE大幅提升
  #   payoff略降（2.31→2.07）但被CE和net_pnl的大幅改善覆盖
  retracement_entry_enabled: true       # 正式启用（2026-07-29 四组验证通过）
  retracement_vwap_band: 0.02           # |VWAP偏离| ≤ 此值视为"回踩到VWAP"（2%，36股网格最优）
  retracement_lookback: 8               # 回看N根K线检查是否有过冲高
  retracement_min_surge: 0.005          # 回看期间最高价相对VWAP的最小偏离（0.5%）
  retracement_kdj_max: 70.0             # KDJ.K需低于此值（回踩时K回落，非追高）
  # ── J4: 冲高确认（卖出侧分离模式，2026-07-29 验证后拒绝启用）──
  # 设计目标：下跌趋势确认后，等价格冲高到VWAP附近再卖出（与J2对称）
  # 验证结论（36股×3年×4组 + 20股×5参数敏感性检查）：
  #   1. J4单独(松参): 配对+101% 净盈亏+77% 但CE均值2.26%→1.82%（-0.44pp，与设计目标相反）
  #   2. 参数敏感性: 松参→CE降(1.73%)；紧参→CE升但退化为baseline(2.07%=baseline)
  #   3. 根因：趋势跟随策略的卖出逻辑是"卖在强势区"(接近日内高点)，已接近最优
  #      J4要求"先跌后反弹到VWAP再卖"，VWAP在下跌日位于日内中低位 → 卖点结构性更低
  #   4. J4无法同时改善CE和net_pnl：要么加量降质(松参)，要么无效(紧参)
  # 决定：保持关闭。原始趋势跟随卖出逻辑(卖在强势)已是CE最优。
  surge_exit_enabled: false             # 拒绝启用（结构性无效，非参数问题）
  surge_vwap_band: 0.005                # |VWAP偏离| ≤ 此值视为"冲高到VWAP"（0.5%）
  surge_lookback: 8                     # 回看N根K线检查是否有过深跌
  surge_min_drop: 0.005                 # 回看期间最低价相对VWAP的最小负偏离（0.5%）
  surge_kdj_min: 40.0                   # KDJ.K需高于此值（冲高时K回升，非杀跌）

# ── 风控参数（at0.risk.RiskParams）──
# P0-1 整改：round_trip_cost 从 0.1% 修正为真实 0.3%（佣金×2+印花税+滑点×2）
# max_t_size_ratio 从 0.5 收紧至 0.25（方案 v1.0 Section 5 Phase 1 研究起点）
risk:
  max_t_size_ratio: 0.25            # 单次T仓位比例上限（底仓的 25%）
  max_t_trades_per_day: 4           # 每日最大T次数
  min_capture_spread: 0.0072        # 最小预期捕获空间（0.72%，扣除0.27%成本后净0.45%）
  round_trip_cost: 0.0027           # 来回成本（0.27% = 佣金万1×2 + 印花税0.05% + 滑点0.1%×2）
  min_net_expected_return: 0.0045   # 最小净期望收益（0.45%，扣除成本后）
  eod_check_time: "14:50"           # 尾盘平衡检查时间

# ── 统一成本模型（cost_model.CostModel）──
# P0-1 整改：成本计算统一收敛到 CostModel，支持三种场景
cost:
  commission_rate: 0.0001           # 佣金（万1，单边）2026-07-24 调降：万2.5→万1
  stamp_tax_rate: 0.0005            # 印花税（0.05%，卖出单边）
  slippage_rate: 0.001              # 滑点（0.1%，单边）
  impact_rate: 0.0000               # 冲击成本（小单忽略）
  scenario: base                    # optimistic / base / pessimistic

# ── 敞口策略（at0.risk.ExposurePolicy）──
# P0-3 整改：尾盘时段限制与交易生命周期
exposure_policy:
  max_open_legs_per_direction: 1    # 每方向最多未配对腿数
  max_holding_bars: 12              # 单笔最大持仓K线数，超过标记expired
  no_new_after_bar_ratio: 0.83      # 14:20后禁止新建风险腿
  exit_only_after_bar_ratio: 0.92   # 14:40后只允许退出
  eod_check_bar_ratio: 0.96         # 14:50尾盘检查
  require_opposite_direction: true  # 有未配对腿时只允许反方向

# ── 市场层情绪分级阈值（market_layer.MarketSnapshot）──
market:
  hot_up_limit: 80                  # 涨停 ≥ 此值 且 跌停 ≤ cold_down_limit → HOT
  cold_up_limit: 20                 # 涨停 ≤ 此值 或 跌停 ≥ cold_down_limit → COLD
  cold_down_limit: 50               # 跌停 ≥ 此值 → COLD
  cool_up_ratio: 30                 # 上涨占比 ≤ 此值 → COOL

# ── 候选筛选参数（candidate_screener.ScreenerParams）──
screener:
  min_20d_amplitude: 0.035          # 20日平均振幅 ≥ 3.5%
  min_20d_amount: 1.0e8             # 20日日均成交额 ≥ 1亿元
  min_capture_spread: 0.006         # 单笔预期捕获空间 ≥ 0.6%
  # ── 60日日均振幅下限（Youden 最优阈值）──
  # 旧默认值: None（关闭），2026-07-28 正式确认为默认配置
  # 决策依据（按证据强度排序）：
  #   1. 【样本外·主依据】F5 500股全池 A/B（3年期）：
  #      baseline(无筛选) 净盈亏 -421,766，成本/毛利比 240.3%
  #      amp_on(0.0494)   净盈亏 +151,364，成本/毛利比 42.5%
  #      其中样本外27只独立股票（与训练集不重叠）：净盈亏 +128,622，盈利占比 70.4%，4/4标准全通过
  #      样本外均值(+4,764) 优于训练集均值(+2,527)，阈值未过拟合
  #   2. 【样本外·辅证】Stage D 步骤2：50只独立股票，6/6 标准全通过
  #   3. 【训练集·参考】100股×3年 A/B：净盈亏 -82,218→+22,959（有偏乐观风险，不作为主依据）
  #   4. 【训练集·参考】F2 误伤股分析：18只误伤股与亏损组无显著差异（p>0.3），无可用例外规则
  #   5. 【训练集·参考】F4 阈值敏感性：0.0494 最优（0.04/0.045 净盈亏更低，0.05 相同）
  #   误伤率：100股口径 19.8%，500股口径 18.5%（一致）
  min_amplitude_long: 0.0494

# ── 回测参数（at0.backtest.BacktestParams）──
# P0 整改：成本字段保留兼容，实际成本计算委托给 CostModel（见 cost 段）
backtest:
  commission_rate: 0.0001           # 佣金费率（万1）— 兼容字段，实际用 cost 段
  stamp_tax_rate: 0.0005            # 印花税（0.05%，卖出单边）— 兼容字段
  slippage: 0.001                   # 滑点（0.1%）— 兼容字段
  cooldown_bars: 24                 # 信号触发后N根K线内不再触发同方向信号（cd24，2026-07-28定案）
  require_opposite_direction: true  # 有未配对腿时只允许反方向信号
  max_holding_bars: 24              # 趋势跟随默认值（注意：运行时会被 cli.adapt_params_by_frequency 按频率覆盖为 5min=12 / 1min=60）
  # ── 止损/止盈结构（2026-07-29 J0+网格搜索定案，新VWAP基线）──
  # 历史依据：
  #   0.004（0.4%）— 51股早期 train/test 验证 + 振幅筛选后网格搜索最优（payoff=0.70, net=+22049）[旧VWAP]
  #   0.02（2%）— 30股×3年网格搜索（未振幅筛选），0.02 更优；但振幅筛选后过宽 [旧VWAP]
  #   0.003（0.3%）— 边界检查（0.002/0.003/0.004 单变量对比，振幅筛选+cd24/mh24）[旧VWAP]
  #     0.003 net=+27734 payoff=0.91 cost/gross=38.5%；0.002 回测更优但0.2%实盘偏激进
  #   0.002（0.2%）— J0 VWAP修复后36股×3年×8值网格搜索最优：
  #     net=+322666 payoff=1.4546 cost/gross=22.9% 35/36盈利（vs 0.003: net=+257396 payoff=0.9541）
  #     趋势完全单调递减（0.002→0.02净盈亏从+322666→+99905）
  #     2026-07-29 正式定案为 0.002（新VWAP下payoff=1.4546远超旧VWAP下任何值，"激进"标签需重新审视）
  stop_loss_ratio: 0.002            # 固定止损 0.2%（新VWAP基线36股×3年网格最优，2026-07-29 定案）
  # ── 移动止盈（2026-07-29 J0+网格搜索定案）──
  # trailing_ratio 历史依据：
  #   0.5 — 原默认值（旧VWAP下未做完整网格）
  #   0.3 — 2026-07-27 B组46股×1年网格最优（旧VWAP: net=+30465 vs 0.5的+2009）
  #   0.2 — 2026-07-29 J0+新VWAP36股×3年×6值网格最优：
  #     net=+623767 payoff=2.3134 36/36盈利（vs 0.3: net=+522645 payoff=2.0054 35/36）
  #     趋势完全单调递减（0.2→0.7净盈亏从+623767→+119883）
  #     机制：新VWAP入场点更准，不需给大回吐空间；tr越小止盈越紧
  trailing_ratio: 0.2               # 移动止盈回撤比例（从最高点回吐20%触发，新VWAP网格最优）
  trailing_activation_pct: 0.0      # 移动止盈激活门槛：0=有盈即锁（J0+网格：0远优于0.003/0.005/0.008）

  # ── Stage K: 均值回归模式专用风控参数（strategy_mode=mean_reversion时生效）──
  # 比趋势跟随更紧：预期胜率低，单笔风险敞口收窄
  # 2026-07-29 v17定稿配置（扩大买卖点距离和持仓时间）：
  #   sl=0.1% 紧止损 + tp=0.8% 大止盈 = 盈亏比8:1
  #   max_hold=30根(150分钟) 给0.8%回归充足时间
  #   600995: 净+508 止盈单笔42.61元 持仓42分钟 盈亏比8.41
  #   10股验证: 净+32,530 10/10全盈利 胜率18.4% 盈亏比6.96
  mr_stop_loss_ratio: 0.001       # 止损0.1%（v17验证最优，v18验证0.3%更差）
  mr_max_holding_bars: 30          # 最大持仓30根（150分钟，配合0.8%止盈给充足回归时间）
  mr_max_t_size_ratio: 0.12        # 仓位12%（趋势跟随0.25更小）
  mr_cooldown_bars: 8              # 冷却8根（趋势跟随24更短）

  # ── V3: Alpha 评分模式专属止损（2026-07-30 100股×1年验证最优）──
  # 网格搜索结果（6组A/B）：
  #   sl=0.002 tr=0.25 → 净+191K 胜率73.5% payoff1.42 盈利79/100 ← 最优
  #   sl=0.003 tr=0.25 → 净+162K 胜率76.1% payoff0.90 盈利69/100
  #   sl=0.004 tr=0.25 → 净+150K 胜率78.9% payoff0.68 盈利66/100
  #   sl=0.004 tr=0.15 → 净+150K 胜率78.9% payoff0.68 盈利66/100（tr=0.15~0.25无差异）
  #   sl=0.004 tr=0.30 → 净+127K 胜率78.9% payoff0.63 盈利58/100（tr=0.30回吐过多）
  # 机制：sl越紧payoff越高（0.002→1.42, 0.003→0.90, 0.004→0.68）
  #       sl=0.002与TF baseline相同，V3 Alpha的高质量信号使紧止损成为优势
  v3_alpha_stop_loss_ratio: 0.002   # V3 止损 0.2%（与TF相同，验证最优）
  v3_alpha_trailing_ratio: 0.25     # V3 移动止盈回撤 25%（tr=0.15~0.25无差异，0.30更差）
  # V3 专属移动止盈激活门槛（2026-07-30 实验结论）
  # 实验证明：trailing_activation_pct=0.0（立即激活）是V3 Alpha唯一能盈利的配置
  # 放宽激活门槛（0.003/0.005）导致胜率从73.5%暴跌至53.6%，净盈亏从+191K→-9K
  # 根因：V3 Alpha信号在5min级别以"高频小赚"模式盈利（avg_win=85, avg_loss=-60）
  #       放宽激活→止损先于trailing触发→avg_loss膨胀(-60→-151)→净亏
  # 结论：V3 Alpha的"买卖点过近"是其盈利模式的固有特征，非bug
  #       要"捕捉完整上涨"需改用趋势跟随信号（TF baseline），非调整trailing参数
  v3_alpha_trailing_activation_pct: 0.0   # 保持0.0（立即激活，实验验证唯一可盈利）

# ── P1: 测量层配置（主计划 S2.6 / S3）──
measurement:
  min_sample_threshold: 5            # 分层回测最小可结论样本量（<5 笔不可结论）
  ic_horizons: [1, 3, 5, 10, 20]    # Alpha Decay 计算周期
  ir_threshold: 0.5                  # 信息比率门槛（P2 验收：IR>0.5 才有预测力）
  param_landscape_min_trades: 10     # 参数平台最小可信交易数
  platform_ratio: 0.8                # 平台区阈值（PnL >= peak x ratio 视为平台内）

# ── P0: 双跑验证配置（主计划 S5）──
dualrun:
  price_tolerance: 0.001             # 成交价比对容差
  pnl_tolerance: 0.01                # 盈亏比对容差
  cost_tolerance: 0.01               # 成本比对容差
