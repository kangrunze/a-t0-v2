# ═══════════════════════════════════════════════════════════════
# L5 T+0 日内做T — 阈值集中配置
# ═══════════════════════════════════════════════════════════════
# 方案 v0.2 第八节："所有阈值集中配置，禁止散落在各脚本里硬编码"
# 各模块 dataclass 默认值仍保留（作为 fallback），实盘入口优先从此文件加载。
# 所有阈值均为起始参考值，需回测校准后才能上生产（方案 v0.2 4.3 节）。

# ── 数据根目录（src/at0/paths.py 读取）──
# 数据已迁出代码仓库，统一存放于此目录。子目录结构与原 data/ 一致：
#   {root}/minute_local/  {root}/zz500_5min/  {root}/minute_bars/  ...
# 优先级：环境变量 AT0_DATA_DIR > 此处 data.root > <项目根>/data
data:
  root: D:\project\data

# ── 决策层信号参数（at0.strategy.SignalParams）──
signal:
  vwap_dev_atr_multiplier: 0.8      # VWAP 偏离度阈值 = ±0.8 × ATR_intraday（相对值）
  bb_period: 20                     # 布林带周期
  bb_std: 2.0                       # 布林带标准差倍数
  ema_period: 20                    # EMA 周期（位置基准补充）
  rsi_period: 14
  rsi_overbought: 70.0              # RSI 超买（辅助，方案 v0.2 起始值）
  rsi_oversold: 30.0                # RSI 超卖（辅助，方案 v0.2 起始值）
  kdj_n: 9
  kdj_m1: 3
  kdj_m2: 3
  kdj_overbought: 80.0              # KDJ K 超买（主触发）
  kdj_oversold: 20.0                # KDJ K 超卖（主触发）
  trend_filter_enabled: true        # 是否启用 MACD/DMI 趋势过滤
  adx_trend_threshold: 25.0         # ADX > 此值视为趋势盘
  vol_ratio_lookback: 5             # 量比当前窗口
  vol_ratio_baseline: 20            # 量比基准窗口
  shrink_threshold: 0.8             # 缩量阈值：当前5min量 < 过去20min均量 × 0.8
  mfi_overbought: 80.0              # MFI 超买（资金超买）
  mfi_oversold: 20.0                # MFI 超卖（资金超卖）
  active_sell_pressure: 0.55        # 主动卖占比 > 此值视为卖压
  active_buy_pressure: 0.55         # 主动买占比 > 此值视为买盘
  min_rules_to_trigger: 3           # 4 项中至少 3 项满足
  open_max_vwap_dev: 0.012          # 开仓深度上限（1.2%）：偏离过深禁止开仓，避免在趋势行情中被当逆势
  # ── 趋势跟随参数（2026-07-24 策略转向，当前主力逻辑）──
  # 数据诊断：5min VWAP偏离后65%概率延续，29%概率回归，转为顺趋势方向开仓
  tf_adx_threshold: 35.0            # ADX > 此值确认趋势存在（v5降频：30→35）
  tf_vol_ratio_min: 2.0             # 量比 > 此值确认量能放大（v5降频：1.5→2.0）
  tf_trend_reverse_adx: 28.0        # ADX<此值视为趋势减弱（平仓条件）
  tf_vwap_cross_threshold: 0.002    # |VWAP偏离| < 此值视为VWAP穿越（平仓条件，0.2%）
  tf_kdj_reverse_bars: 2            # KDJ连续N根反向确认（平仓条件，防单根噪声）
  # ── P2: Alpha 连续评分开关（主计划 S2.3，默认关闭）──
  use_continuous_alpha: false        # flag=false 时行为与改造前逐笔一致
  alpha_weight_vwap: 1.0             # Alpha 评分权重（等权起步）
  alpha_weight_rsi: 1.0
  alpha_weight_kdj: 1.0
  alpha_weight_adx: 1.0
  alpha_weight_volume: 1.0
  alpha_threshold_open: 60.0         # 连续评分模式开仓门槛
  # ── J2: 回踩入场（买入侧分离模式，2026-07-29 验证通过正式启用）──
  # 设计：趋势确认（历史冲高）+ 入场价格确定（回踩到VWAP附近）分离
  # 验证依据（36股×3年×4组A/B，新VWAP基线 sl=0.002/tr=0.2）：
  #   baseline(关): 配对5375 净盈亏+623,767 CE均值2.26% CE中位1.91% payoff2.31
  #   J2(开):      配对10123 净盈亏+1,184,608(+90%) CE均值3.14%(+39%) CE中位2.06% payoff2.07
  #   win_rate 69.0%→69.1%（维持），成本毛利比 12.3%→9.3%（改善）
  #   机制：回踩到VWAP附近买入，买入点更贴近日内相对低点 → CE大幅提升
  #   payoff略降（2.31→2.07）但被CE和net_pnl的大幅改善覆盖
  retracement_entry_enabled: true       # 正式启用（2026-07-29 四组验证通过）
  retracement_min_adx: 25.0             # ADX需超过此值确认趋势存在
  retracement_vwap_band: 0.02           # |VWAP偏离| ≤ 此值视为"回踩到VWAP"（2%，36股网格最优）
  retracement_lookback: 8               # 回看N根K线检查是否有过冲高
  retracement_min_surge: 0.005          # 回看期间最高价相对VWAP的最小偏离（0.5%）
  retracement_kdj_max: 70.0             # KDJ.K需低于此值（回踩时K回落，非追高）
  # ── J4: 冲高确认（卖出侧分离模式，2026-07-29 验证后拒绝启用）──
  # 设计目标：下跌趋势确认后，等价格冲高到VWAP附近再卖出（与J2对称）
  # 验证结论（36股×3年×4组 + 20股×5参数敏感性检查）：
  #   1. J4单独(松参): 配对+101% 净盈亏+77% 但CE均值2.26%→1.82%（-0.44pp，与设计目标相反）
  #   2. 参数敏感性: 松参→CE降(1.73%)；紧参→CE升但退化为baseline(2.07%=baseline)
  #   3. 根因：趋势跟随策略的卖出逻辑是"卖在强势区"(接近日内高点)，已接近最优
  #      J4要求"先跌后反弹到VWAP再卖"，VWAP在下跌日位于日内中低位 → 卖点结构性更低
  #   4. J4无法同时改善CE和net_pnl：要么加量降质(松参)，要么无效(紧参)
  # 决定：保持关闭。原始趋势跟随卖出逻辑(卖在强势)已是CE最优。
  surge_exit_enabled: false             # 拒绝启用（结构性无效，非参数问题）
  surge_vwap_band: 0.005                # |VWAP偏离| ≤ 此值视为"冲高到VWAP"（0.5%）
  surge_lookback: 8                     # 回看N根K线检查是否有过深跌
  surge_min_drop: 0.005                 # 回看期间最低价相对VWAP的最小负偏离（0.5%）
  surge_kdj_min: 40.0                   # KDJ.K需高于此值（冲高时K回升，非杀跌）

# ── 风控参数（at0.risk.RiskParams）──
# P0-1 整改：round_trip_cost 从 0.1% 修正为真实 0.3%（佣金×2+印花税+滑点×2）
# max_t_size_ratio 从 0.5 收紧至 0.25（方案 v1.0 Section 5 Phase 1 研究起点）
risk:
  max_t_size_ratio: 0.25            # 单次T仓位比例上限（底仓的 25%）
  max_t_trades_per_day: 4           # 每日最大T次数
  min_capture_spread: 0.0072        # 最小预期捕获空间（0.72%，扣除0.27%成本后净0.45%）
  round_trip_cost: 0.0027           # 来回成本（0.27% = 佣金万1×2 + 印花税0.05% + 滑点0.1%×2）
  min_net_expected_return: 0.0045   # 最小净期望收益（0.45%，扣除成本后）
  eod_check_time: "14:50"           # 尾盘平衡检查时间

# ── 统一成本模型（cost_model.CostModel）──
# P0-1 整改：成本计算统一收敛到 CostModel，支持三种场景
cost:
  commission_rate: 0.0001           # 佣金（万1，单边）2026-07-24 调降：万2.5→万1
  stamp_tax_rate: 0.0005            # 印花税（0.05%，卖出单边）
  slippage_rate: 0.001              # 滑点（0.1%，单边）
  impact_rate: 0.0000               # 冲击成本（小单忽略）
  scenario: base                    # optimistic / base / pessimistic

# ── 敞口策略（at0.risk.ExposurePolicy）──
# P0-3 整改：尾盘时段限制与交易生命周期
exposure_policy:
  max_open_legs_per_direction: 1    # 每方向最多未配对腿数
  max_holding_bars: 12              # 单笔最大持仓K线数，超过标记expired
  no_new_after_bar_ratio: 0.83      # 14:20后禁止新建风险腿
  exit_only_after_bar_ratio: 0.92   # 14:40后只允许退出
  eod_check_bar_ratio: 0.96         # 14:50尾盘检查
  require_opposite_direction: true  # 有未配对腿时只允许反方向

# ── 市场层情绪分级阈值（market_layer.MarketSnapshot）──
market:
  hot_up_limit: 80                  # 涨停 ≥ 此值 且 跌停 ≤ cold_down_limit → HOT
  cold_up_limit: 20                 # 涨停 ≤ 此值 或 跌停 ≥ cold_down_limit → COLD
  cold_down_limit: 50               # 跌停 ≥ 此值 → COLD
  cool_up_ratio: 30                 # 上涨占比 ≤ 此值 → COOL

# ── 候选筛选参数（candidate_screener.ScreenerParams）──
screener:
  min_20d_amplitude: 0.035          # 20日平均振幅 ≥ 3.5%
  min_20d_amount: 1.0e8             # 20日日均成交额 ≥ 1亿元
  min_capture_spread: 0.006         # 单笔预期捕获空间 ≥ 0.6%
  # ── 60日日均振幅下限（Youden 最优阈值）──
  # 旧默认值: None（关闭），2026-07-28 正式确认为默认配置
  # 决策依据（按证据强度排序）：
  #   1. 【样本外·主依据】F5 500股全池 A/B（3年期）：
  #      baseline(无筛选) 净盈亏 -421,766，成本/毛利比 240.3%
  #      amp_on(0.0494)   净盈亏 +151,364，成本/毛利比 42.5%
  #      其中样本外27只独立股票（与训练集不重叠）：净盈亏 +128,622，盈利占比 70.4%，4/4标准全通过
  #      样本外均值(+4,764) 优于训练集均值(+2,527)，阈值未过拟合
  #   2. 【样本外·辅证】Stage D 步骤2：50只独立股票，6/6 标准全通过
  #   3. 【训练集·参考】100股×3年 A/B：净盈亏 -82,218→+22,959（有偏乐观风险，不作为主依据）
  #   4. 【训练集·参考】F2 误伤股分析：18只误伤股与亏损组无显著差异（p>0.3），无可用例外规则
  #   5. 【训练集·参考】F4 阈值敏感性：0.0494 最优（0.04/0.045 净盈亏更低，0.05 相同）
  #   误伤率：100股口径 19.8%，500股口径 18.5%（一致）
  min_amplitude_long: 0.0494

# ── 回测参数（at0.backtest.BacktestParams）──
# P0 整改：成本字段保留兼容，实际成本计算委托给 CostModel（见 cost 段）
backtest:
  commission_rate: 0.0001           # 佣金费率（万1）— 兼容字段，实际用 cost 段
  stamp_tax_rate: 0.0005            # 印花税（0.05%，卖出单边）— 兼容字段
  slippage: 0.001                   # 滑点（0.1%）— 兼容字段
  cooldown_bars: 24                 # 信号触发后N根K线内不再触发同方向信号（cd24，2026-07-28定案）
  require_opposite_direction: true  # 有未配对腿时只允许反方向信号
  max_holding_bars: 24              # P0-2: 单笔最大持仓K线数（mh24，cd24/mh24组合验证过）
  # ── 止损/止盈结构（2026-07-29 J0+网格搜索定案，新VWAP基线）──
  # 历史依据：
  #   0.004（0.4%）— 51股早期 train/test 验证 + 振幅筛选后网格搜索最优（payoff=0.70, net=+22049）[旧VWAP]
  #   0.02（2%）— 30股×3年网格搜索（未振幅筛选），0.02 更优；但振幅筛选后过宽 [旧VWAP]
  #   0.003（0.3%）— 边界检查（0.002/0.003/0.004 单变量对比，振幅筛选+cd24/mh24）[旧VWAP]
  #     0.003 net=+27734 payoff=0.91 cost/gross=38.5%；0.002 回测更优但0.2%实盘偏激进
  #   0.002（0.2%）— J0 VWAP修复后36股×3年×8值网格搜索最优：
  #     net=+322666 payoff=1.4546 cost/gross=22.9% 35/36盈利（vs 0.003: net=+257396 payoff=0.9541）
  #     趋势完全单调递减（0.002→0.02净盈亏从+322666→+99905）
  #     2026-07-29 正式定案为 0.002（新VWAP下payoff=1.4546远超旧VWAP下任何值，"激进"标签需重新审视）
  stop_loss_ratio: 0.002            # 固定止损 0.2%（新VWAP基线36股×3年网格最优，2026-07-29 定案）
  # ── 移动止盈（2026-07-29 J0+网格搜索定案）──
  # trailing_ratio 历史依据：
  #   0.5 — 原默认值（旧VWAP下未做完整网格）
  #   0.3 — 2026-07-27 B组46股×1年网格最优（旧VWAP: net=+30465 vs 0.5的+2009）
  #   0.2 — 2026-07-29 J0+新VWAP36股×3年×6值网格最优：
  #     net=+623767 payoff=2.3134 36/36盈利（vs 0.3: net=+522645 payoff=2.0054 35/36）
  #     趋势完全单调递减（0.2→0.7净盈亏从+623767→+119883）
  #     机制：新VWAP入场点更准，不需给大回吐空间；tr越小止盈越紧
  trailing_ratio: 0.2               # 移动止盈回撤比例（从最高点回吐20%触发，新VWAP网格最优）
  trailing_activation_pct: 0.0      # 移动止盈激活门槛：0=有盈即锁（J0+网格：0远优于0.003/0.005/0.008）

# ── P1: 测量层配置（主计划 S2.6 / S3）──
measurement:
  min_sample_threshold: 5            # 分层回测最小可结论样本量（<5 笔不可结论）
  ic_horizons: [1, 3, 5, 10, 20]    # Alpha Decay 计算周期
  ir_threshold: 0.5                  # 信息比率门槛（P2 验收：IR>0.5 才有预测力）
  param_landscape_min_trades: 10     # 参数平台最小可信交易数
  platform_ratio: 0.8                # 平台区阈值（PnL >= peak x ratio 视为平台内）

# ── P0: 双跑验证配置（主计划 S5）──
dualrun:
  price_tolerance: 0.001             # 成交价比对容差
  pnl_tolerance: 0.01                # 盈亏比对容差
  cost_tolerance: 0.01               # 成本比对容差
